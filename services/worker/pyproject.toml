[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worker"
version = "0.1.0"
description = "Conversation Intelligence Platform Worker Service"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "litellm>=1.40",
    "instructor>=1.3",
    "deepgram-sdk>=3.4,<4.0",
    "aiobotocore>=2.9",
    "asgiref>=3.7",
    "pgvector>=0.3",
    "structlog",
]
