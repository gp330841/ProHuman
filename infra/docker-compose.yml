services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: prohuman-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-prohuman}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-prohuman}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - prohuman-net

  redis:
    image: redis:7-alpine
    container_name: prohuman-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - prohuman-net

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: prohuman-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - prohuman-net

  migrate:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    command: alembic -c packages/db/alembic/alembic.ini upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-prohuman}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prohuman-net

  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    container_name: prohuman-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-prohuman}
      GATEWAY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-prohuman}
      REDIS_URL: redis://redis:6379/0
      GATEWAY_REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      GATEWAY_S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      GATEWAY_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      GATEWAY_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-audio-recordings}
      GATEWAY_S3_BUCKET_NAME: ${S3_BUCKET_NAME:-audio-recordings}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PROHUMAN_CREDENTIALS: ${PROHUMAN_CREDENTIALS:-}
      GATEWAY_DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      GATEWAY_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - prohuman-net

  worker-stt:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    container_name: prohuman-worker-stt
    restart: unless-stopped
    command: celery -A app.celery_app worker -Q transcription -c 2 --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-prohuman}
      WORKER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-prohuman}
      REDIS_URL: redis://redis:6379/0
      WORKER_REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      WORKER_S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      WORKER_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      WORKER_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-audio-recordings}
      WORKER_S3_BUCKET_NAME: ${S3_BUCKET_NAME:-audio-recordings}
      WORKER_DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      PYTHONPATH: /app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - prohuman-net

  worker-embedding:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    container_name: prohuman-worker-embedding
    restart: unless-stopped
    command: celery -A app.celery_app worker -Q embedding -c 4 --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-prohuman}
      WORKER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-prohuman}
      REDIS_URL: redis://redis:6379/0
      WORKER_REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      WORKER_S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      WORKER_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      WORKER_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-audio-recordings}
      WORKER_S3_BUCKET_NAME: ${S3_BUCKET_NAME:-audio-recordings}
      WORKER_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PYTHONPATH: /app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - prohuman-net

  worker-features:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    container_name: prohuman-worker-features
    restart: unless-stopped
    command: celery -A app.celery_app worker -Q features -c 2 --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-prohuman}
      WORKER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-prohuman}
      REDIS_URL: redis://redis:6379/0
      WORKER_REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      WORKER_S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      WORKER_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      WORKER_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-audio-recordings}
      WORKER_S3_BUCKET_NAME: ${S3_BUCKET_NAME:-audio-recordings}
      WORKER_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WORKER_GEMINI_API_KEY: ${WORKER_GEMINI_API_KEY:-${GEMINI_API_KEY:-}}
      WORKER_DEFAULT_LLM_MODEL: ${WORKER_DEFAULT_LLM_MODEL:-gemini-3.8-flash}
      PYTHONPATH: /app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - prohuman-net

  agent:
    build:
      context: ..
      dockerfile: services/agent/Dockerfile
    container_name: prohuman-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-prohuman}
      AGENT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-prohuman}
      REDIS_URL: redis://redis:6379/0
      AGENT_REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENT_GEMINI_API_KEY: ${AGENT_GEMINI_API_KEY:-${GEMINI_API_KEY:-}}
      AGENT_DEFAULT_LLM_MODEL: ${AGENT_DEFAULT_LLM_MODEL:-gemini-3.8-flash}
      PROHUMAN_CREDENTIALS: ${PROHUMAN_CREDENTIALS:-}
      AGENT_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - prohuman-net

  web-ui:
    build: ../services/web-ui
    container_name: prohuman-web-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - prohuman-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  prohuman-net:
    driver: bridge
