name: CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'services/gateway/**'
      - 'services/worker/**'
      - 'services/agent/**'
      - 'services/web-ui/**'
      - 'infra/**'
      - 'simulation/release_smoke*.py'
      - '.github/workflows/ci.yml'
      - 'pyproject.toml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'services/gateway/**'
      - 'services/worker/**'
      - 'services/agent/**'
      - 'services/web-ui/**'
      - 'infra/**'
      - 'simulation/release_smoke*.py'
      - '.github/workflows/ci.yml'
      - 'pyproject.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic pydantic-settings sqlalchemy asyncpg celery redis litellm instructor fastapi uvicorn types-redis

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Mypy Type Checker
        run: mypy packages/ services/

  test-packages:
    name: Test Packages
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prohuman
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/prohuman
      REDIS_URL: redis://localhost:6379/0
      PYTHONPATH: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio alembic asyncpg sqlalchemy pgvector pydantic pydantic-settings redis structlog

      - name: Run Alembic Migrations
        run: alembic -c packages/db/alembic/alembic.ini upgrade head

      - name: Run Package Tests
        run: pytest packages/ -v

  test-gateway:
    name: Test Gateway Service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prohuman
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/prohuman
      GATEWAY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/prohuman
      REDIS_URL: redis://localhost:6379/0
      GATEWAY_REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: audio-recordings
      PYTHONPATH: .:services/gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          pip install -e ./services/gateway

      - name: Run Gateway Tests
        run: pytest services/gateway/ -v

  test-worker:
    name: Test Worker Service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prohuman
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/prohuman
      WORKER_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/prohuman
      REDIS_URL: redis://localhost:6379/0
      WORKER_REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: audio-recordings
      PYTHONPATH: .:services/worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -e ./services/worker

      - name: Run Worker Tests
        run: pytest -o pythonpath=. services/worker/ -v

  test-agent:
    name: Test Agent Service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prohuman
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/prohuman
      AGENT_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/prohuman
      REDIS_URL: redis://localhost:6379/0
      AGENT_REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: fake-ci-key
      PYTHONPATH: .:services/agent
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          pip install -e ./services/agent

      - name: Run Agent Tests
        run: pytest -o pythonpath=. services/agent/ -v

  web-ui:
    name: Build Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/web-ui/package-lock.json
      - run: npm ci
      - run: npm run build

  release-smoke:
    name: Browser to recording and insights
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./services/worker playwright
      - run: playwright install --with-deps chromium
      - name: Set up separate test workspaces
        run: CONFIGURE_RELEASE_SMOKE=1 python -m simulation.release_smoke
      - name: Start data services, migrate an empty database, and start the web app
        run: docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 120 postgres redis minio gateway web-ui
      - name: Verify upgrade of a pre-existing database
        run: |
          compose() { docker compose -f infra/docker-compose.yml "$@"; }
          compose exec -T postgres psql -v ON_ERROR_STOP=1 -U postgres -c 'CREATE DATABASE prohuman_legacy'
          legacy_url=postgresql+asyncpg://postgres:postgres@postgres:5432/prohuman_legacy
          compose run --rm -e DATABASE_URL="$legacy_url" migrate alembic -c packages/db/alembic/alembic.ini upgrade 0001_recording_baseline
          compose exec -T postgres psql -v ON_ERROR_STOP=1 -U postgres -d prohuman_legacy <<'SQL'
          DROP TABLE alembic_version;
          INSERT INTO sessions (id, device_id, status) VALUES ('00000000-0000-0000-0000-000000000001', 'legacy-device', 'TRANSCRIBED');
          INSERT INTO transcript_segments (session_id, segment_index, speaker_label, text, start_time, end_time)
            VALUES ('00000000-0000-0000-0000-000000000001', 0, 'speaker_0', 'legacy transcript', 0, 1);
          SQL
          compose run --rm -e DATABASE_URL="$legacy_url" migrate alembic -c packages/db/alembic/alembic.ini upgrade head
          test "$(compose exec -T postgres psql -tA -v ON_ERROR_STOP=1 -U postgres -d prohuman_legacy -c "SELECT count(*) FROM sessions JOIN transcript_segments ON sessions.id = transcript_segments.session_id WHERE workspace_id IS NULL AND text = 'legacy transcript'")" = 1
      - name: Verify recording recovery and workspace permissions
        env:
          PYTHONPATH: .:services/worker
          WORKER_S3_ENDPOINT_URL: http://127.0.0.1:9000
          WORKER_DEEPGRAM_API_KEY: smoke-placeholder
        run: |
          python -m simulation.release_smoke_worker >"$RUNNER_TEMP/prohuman-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          python -m simulation.release_smoke
      - name: Show service logs
        if: failure()
        run: |
          docker compose -f infra/docker-compose.yml logs --tail 80
          if [ -f "$RUNNER_TEMP/prohuman-worker.log" ]; then tail -80 "$RUNNER_TEMP/prohuman-worker.log"; fi

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/gateway/Dockerfile
          push: false
          tags: prohuman/gateway:ci

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/worker/Dockerfile
          push: false
          tags: prohuman/worker:ci

      - name: Build Agent Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/agent/Dockerfile
          push: false
          tags: prohuman/agent:ci
