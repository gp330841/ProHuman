version: '3'

dotenv: ['.env']

env:
  PYTHONPATH: '{{.PWD}}:{{.PWD}}/packages:{{.PWD}}/services/gateway:{{.PWD}}/services/worker:{{.PWD}}/services/agent'

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  dev:
    desc: "Start all infrastructure and application services in detached mode"
    cmds:
      - docker compose -f infra/docker-compose.yml up -d

  dev:down:
    desc: "Stop and remove all running development containers"
    cmds:
      - docker compose -f infra/docker-compose.yml down

  dev:logs:
    desc: "Stream real-time logs from all services (or specific service via CLI args)"
    cmds:
      - docker compose -f infra/docker-compose.yml logs -f {{.CLI_ARGS}}

  dev:ui:
    desc: "Start web-ui frontend in Vite development mode on port 3000"
    dir: "services/web-ui"
    cmds:
      - npm run dev

  migrate:
    desc: "Run database migrations to latest revision (alembic upgrade head)"
    cmds:
      - alembic -c packages/db/alembic/alembic.ini upgrade head

  migrate:generate:
    desc: "Generate new Alembic migration revision with autogenerated changes"
    cmds:
      - alembic -c packages/db/alembic/alembic.ini revision --autogenerate -m "{{.CLI_ARGS | default \"auto_migration\"}}"

  test:
    desc: "Run pytest across all packages and services"
    cmds:
      - pytest packages/ services/gateway/ services/worker/ services/agent/ {{.CLI_ARGS}}

  test:gateway:
    desc: "Run pytest for gateway service"
    cmds:
      - pytest services/gateway/ {{.CLI_ARGS}}

  test:worker:
    desc: "Run pytest for worker service"
    cmds:
      - pytest services/worker/ {{.CLI_ARGS}}

  test:agent:
    desc: "Run pytest for agent service"
    cmds:
      - pytest services/agent/ {{.CLI_ARGS}}

  lint:
    desc: "Run ruff check and mypy type checking on packages and services"
    cmds:
      - ruff check .
      - mypy packages/ services/

  fmt:
    desc: "Format code using ruff formatter"
    cmds:
      - ruff format .

  build:
    desc: "Build all container images defined in docker-compose.yml"
    cmds:
      - docker compose -f infra/docker-compose.yml build
